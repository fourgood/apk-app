ex:none}.sortcontrols button{border:1px solid #495769;border-radius:9px;background:#2d3945;color:#fff;width:36px;height:36px;font-size:19px;line-height:1;padding:0}.sortcontrols button:disabled{opacity:.18}
.footeractions{display:grid;grid-template-columns:1.1fr .78fr 1.23fr;gap:6px;margin-top:auto;flex:none}.actionbtn{height:41px;background:#1e2832;border:1px solid var(--line);border-radius:11px;color:#dde5ed;font-size:12px;font-weight:800;min-width:0;white-space:nowrap;padding:0 5px}.actionbtn span{margin-right:3px;font-size:15px}.finishbtn{background:#33422c;border-color:#79954c;color:#e6ff99}.hint{color:var(--sub);font-size:11px;font-weight:600;text-align:center;min-height:15px;flex:none}.hint:empty{display:none}

olid var(--line);border-radius:10px;background:#222e39;padding:5px 11px;font-variant-numeric:tabular-nums}.resultrow.winner{border-color:#95b258;background:#2b3d2e}.resultrank{min-width:26px;font-size:17px;font-weight:900;color:#aebccb}.winner .resultrank{color:var(--lime)}.resultdot{height:9px;width:9px;background:var(--pcolor);border-radius:3px;flex:none}.resultname{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.resultname b{font-size:15px;line-height:1.05}.resultname small{font-size:10px;color:#a9b8c5}.resultpoints{text-align:right;font-size:22px;font-weight:900;letter-spacing:-.5px}.resultpoints small{display:block;font-size:9px;color:#96a4b1;font-weight:700;letter-spacing:0}.resultsactions{padding:12px 15px 15px}.resultsactions button{height:41px}.resultsactions #newFromResults{background:var(--lime);border:0;color:#172017}.toast{position:fixed;bottom: max(19px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);z-index:30;pointer-events:none;background:var(--lime);color:#111820;padding:10px 16px;border-radius:11px;box-shadow:0 5px 20px #0008;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;opacity:0;transition:opacity .15s,transform .15s}.toast.show{opacity:1;transform:translate(-50%,0)}

/* Player setup */
[hidden]{display:none!important}
.setupScreen{max-width:510px;margin:0 auto;height:100vh;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 13px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overflow:hidden}
.setuphead{display:flex;align-items:center;justify-content:space-between;min-height:42px;flex:none}.setupintro h1{font-size:26px;line-height:1.14;margin:0 0 6px;font-weight:850;letter-spacing:-.8px}.setupintro p{color:var(--sub);margin:0;font-size:13px;line-height:1.35}.setuplabel{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.2px}.setupPlayers{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;overscroll-behavior:contain;padding:2px 1px 4px}.setuprow{background:#1e2934;border:1px solid #44505f;border-radius:12px;display:flex;align-items:center;gap:10px;height:51px;min-height:51px;padding:0 9px}.setupdot{width:11px;height:11px;background:var(--pcolor);border-radius:4px;flex:none}.setupname{width:100%;min-width:0;height:40px;color:#f5f7fa;background:transparent;border:0;outline:none!important;font-weight:750;font-size:16px}.setupname:focus{border-bottom:2px solid var(--lime)}.removeplayer{height:30px;width:30px;border:0;border-radius:8px;color:#adbbc7;background:#303e4a;font-size:22px;line-height:1;flex:none}.addplayer{border:1px dashed #637080;background:#18232e;color:var(--lime);border-radius:11px;height:39px;flex:none;font-size:13px;font-weight:800}.setupbottom{margin-top:auto;flex:none;display:flex;flex-direction:column;gap:8px}.setupbottom p{text-align:center;color:#a5b2bf;font-size:12px;margin:0}.startgame{background:var(--lime);color:#111a18;border:0;height:51px;border-radius:13px;font-weight:900;font-size:16px;width:100%}.draghandle{flex:none;display:grid;place-items:center;width:36px;height:38px;background:#303d49;border:1px solid #465463;color:#bdc9d4;border-radius:9px;font-size:23px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:1;padding:0}.draghandle:active{cursor:grabbing}.playerrow>.draghandle{margin:0 7px 0 0;width:37px;height:36px}.dragging-placeholder{opacity:.29}.dragghost{box-shadow:0 12px 32px #000b;opacity:.94;background:#263742!important;border:1px solid var(--lime)!important;filter:brightness(1.12)}.dragghost *{pointer-events:none!important}
.players{overflow-y:auto;overscroll-behavior:contain;max-height:calc(100dvh - 290px)}.board{flex:1 1 auto;min-height:0}.boardhead{flex:none}.players{min-height:0}.setupScreen .brand b{font-size:23px}
@media(max-height:620px){.setupScreen{gap:8px;padding-top:max(7px,env(safe-area-inset-top));padding-bottom:max(7px,env(safe-area-inset-bottom))}.setupintro h1{font-size:22px;margin-bottom:4px}.setupintro p{font-size:12px}.setuprow{height:45px;min-height:45px}.setupname{height:36px}.setupbottom{gap:5px}.setupbottom p{font-size:11px}.startgame{height:43px}.addplayer{height:34px}.setupPlayers{gap:5px}}
@media(max-height:525px){.setupintro h1{font-size:19px}.setuprow{height:40px;min-height:40px}.setupScreen{gap:5px}.setuphead{min-height:35px}.setupbottom p{display:none}}

<body>
<section id="setupScreen" class="setupScreen" aria-labelledby="setupTitle" hidden>
<header class="setuphead"><div class="brand"><span class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>QWIRKLE</b></div><button class="minorbtn" id="cancelSetup" type="button" hidden>Abbrechen</button></header>
<div class="setupintro"><h1 id="setupTitle">Wer spielt mit?</h1><p>Namen festlegen und am Griff ⠿ ziehen, um die Spielreihenfolge zu ändern.</p></div>
<div class="setuplabel"><span>SPIELER &amp; REIHENFOLGE</span><span id="setupCount">2 Spieler</span></div>
<div id="setupPlayers" class="setupPlayers" aria-label="Spieler sortieren"></div>
<button class="addplayer" id="addPlayer" type="button">＋ Spieler hinzufügen</button>
<div class="setupbottom"><p>Die oberste Person beginnt.</p><button id="startGame" class="startgame" type="button">Spiel starten →</button></div>
</section>
<main id="gameScreen" hidden>
<header class="top"><div class="brand"><span class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>QWIRKLE</b></div><button class="minorbtn" id="newGame" type="button">↻ Neues Spiel</button></header>
<section class="entry" aria-label="Zugpunkte eingeben"><div class="turnline"><div class="turnleft"><small>AM ZUG</small><span class="turnname" id="activeName">–</span></div><span class="turnscore">Gesamt <strong id="activeScore">0</strong></span></div><form id="scoreForm" autocomplete="off"><div class="entryline"><label class="inputwrap"><input id="scoreInput" inputmode="numeric" type="text" pattern="[0-9]*" maxlength="4" placeholder="0" aria-label="Punkte des aktuellen Zugs" enterkeyhint="done"><span>PKT</span></label><button type="submit" class="save" id="saveButton" disabled>+ Buchen</button></div></form></section>
<section class="board" aria-label="Spielstand"><div class="boardhead"><div class="boardtitle"><h2>Spielstand</h2></div><button class="orderbtn" type="button" id="orderButton" aria-pressed="false">↕ Reihenfolge</button></div><div class="players" id="players"></div></section>
<div class="hint" id="hint" aria-live="polite"></div>
<footer class="footeractions"><button type="button" class="actionbtn" id="undo"><span>↶</span> Rückgängig</button><button type="button" class="actionbtn" id="showHistory"><span>≡</span> Verlauf</button><button type="button" class="actionbtn finishbtn" id="finishGame">Spiel beenden</button></footer>
</main>
<div class="overlay" id="historyOverlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle">Letzte Züge</h2><button class="close" type="button" id="closeHistory" aria-label="Verlauf schließen">×</button></div><ol class="history" id="history"></ol><div class="dialogfoot"><button class="actionbtn" id="share" type="button">↗ Stand teilen</button><button class="actionbtn" id="closeHistoryBottom" type="button">Schließen</button></div></section></div>
<div class="overlay resultsOverlay" id="resultsOverlay" hidden><section class="dialog resultdialog" role="dialog" aria-modal="true" aria-labelledby="resultsTitle"><div class="dialoghead resulthead"><div><span class="eyebrow">SPIEL BEENDET</span><h2 id="resultsTitle">Endstand</h2></div><button class="minorbtn" id="shareResult" type="button">↗ Teilen</button></div><div class="champion" id="champion"></div><ol class="resultlist" id="resultList"></ol><div class="dialogfoot resultsactions"><button class="actionbtn" id="resumeGame" type="button">Weiterspielen</button><button class="actionbtn" id="newFromResults" type="button">Neues Spiel</button></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const colors=['#f5cb66','#ee8aaf','#78c7f3','#b79bea','#87d4ae','#f3a073','#84dadd','#e0c07a','#db91e8','#a0c96c','#ed8080','#96a7e9'];
const key='qwirkle-familie-punkte-v1',el=id=>document.getElementById(id);
const emptyState=()=>({people:[],order:[],activeId:null,history:[],finished:false,setupDone:false});
const blankPlayers=()=>Array.from({length:2},(_,i)=>({id:'new'+i+'-'+Date.now().toString(36),name:'',color:colors[i]}));
let state=emptyState(),draft=[],reordering=false,toastTimer,drag=null;
const person=id=>state.people.find(p=>p.id===id);
try{
  const raw=JSON.parse(localStorage.getItem(key)||'null');
  if(raw&&Array.isArray(raw.history)){
    let people=Array.isArray(raw.people)?raw.people.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.trim()).slice(0,12).map((p,i)=>({id:p.id,name:p.name.trim().slice(0,24),color:typeof p.color==='string'&&/^#[a-f0-9]{6}$/i.test(p.color)?p.color:colors[i%colors.length]})):[];
    if(!people.length)people=[];
    const valid=new Set(people.map(p=>p.id));
    const order=Array.isArray(raw.order)&&raw.order.length===people.length&&new Set(raw.order).size===people.length&&raw.order.every(pid=>valid.has(pid))?raw.order:[...valid];
    const activeId=valid.has(raw.activeId)?raw.activeId:(Number.isInteger(raw.active)&&raw.active>=0&&raw.active<order.length?order[raw.active]:order[0]);
    const history=raw.history.filter(m=>m&&valid.has(m.pid)&&Number.isSafeInteger(m.total)&&m.total>=0).map((m,i)=>({id:typeof m.id==='string'?m.id:'old'+i,pid:m.pid,total:m.total}));
    state={people,order,activeId,history,finished:raw.finished===true,setupDone:people.length>=2&&(raw.setupDone===true||history.length>0||raw.finished===true)};
  }
}catch(err){}
const persist=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(err){}};
function stats(){const totals=Object.fromEntries(state.order.map(pid=>[pid,0])),turns=Object.fromEntries(state.order.map(pid=>[pid,0]));for(const m of state.history){if(m.pid in totals){totals[m.pid]+=m.total;turns[m.pid]++}}return {totals,turns}}
function updateButton(){const input=el('scoreInput');const val=input.value.replace(/\D/g,'').slice(0,4);if(val!==input.value)input.value=val;el('saveButton').disabled=val===''||state.finished}
function resetEntry(){el('scoreInput').value='';updateButton()}
function alertToast(msg){const n=el('toast');n.textContent=msg;n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),1450)}
function select(pid){if(reordering||state.finished)return;state.activeId=pid;persist();resetEntry();render()}
function grip(pid,forSetup=false){const handle=document.createElement('button');handle.type='button';handle.className='draghandle';handle.textContent='⠿';handle.setAttribute('aria-label',`${forSetup?'Spieler':'Spielreihenfolge'} ${forSetup?(draft.find(p=>p.id===pid)?.name||'ohne Name'):person(pid)?.name}: ziehen oder Pfeiltasten zum Verschieben`);handle.setAttribute('title','Ziehen, um Reihenfolge zu ändern');handle.addEventListener('pointerdown',e=>startDrag(e,handle,forSetup));handle.addEventListener('keydown',e=>{if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();const list=forSetup?el('setupPlayers'):el('players');const row=handle.closest('[data-pid]');const siblings=[...list.children];const index=siblings.indexOf(row),other=siblings[index+(e.key==='ArrowUp'?-1:1)];if(!other)return;if(e.key==='ArrowUp')list.insertBefore(row,other);else list.insertBefore(other,row);applyOrderFromDom(list,forSetup);handle.focus()});return handle}
function applyOrderFromDom(list,forSetup){const ids=[...list.children].map(node=>node.dataset.pid);if(forSetup){const byId=new Map(draft.map(p=>[p.id,p]));draft=ids.map(id=>byId.get(id)).filter(Boolean)}else{state.order=ids;persist();render()}}
function startDrag(e,handle,forSetup){if(e.button!==0&&e.pointerType==='mouse')return;if(drag)return;e.preventDefault();const row=handle.closest('[data-pid]'),list=row.parentElement;const rect=row.getBoundingClientRect();const ghost=row.cloneNode(true);ghost.classList.add('dragghost');ghost.style.position='fixed';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';ghost.style.zIndex='100';ghost.style.pointerEvents='none';ghost.style.transform='none';document.body.append(ghost);row.classList.add('dragging-placeholder');drag={id:e.pointerId,from:e.clientY,top:rect.top,ghost,row,list,forSetup};document.addEventListener('pointermove',onDragMove,{passive:false});document.addEventListener('pointerup',onDragEnd);document.addEventListener('pointercancel',onDragEnd)}
function onDragMove(e){if(!drag||e.pointerId!==drag.id)return;e.preventDefault();drag.ghost.style.top=(drag.top+e.clientY-drag.from)+'px';const siblings=[...drag.list.children].filter(node=>node!==drag.row);const target=siblings.find(node=>e.clientY<node.getBoundingClientRect().top+node.getBoundingClientRect().height/2);if(target!==drag.row.nextElementSibling){drag.list.insertBefore(drag.row,target||null)}}
function onDragEnd(e){if(!drag||e.pointerId!==drag.id)return;const {ghost,row,list,forSetup}=drag;ghost.remove();row.classList.remove('dragging-placeholder');document.removeEventListener('pointermove',onDragMove);document.removeEventListener('pointerup',onDragEnd);document.removeEventListener('pointercancel',onDragEnd);drag=null;applyOrderFromDom(list,forSetup);if(forSetup)renderSetup()}
function makeRow(pid,i,t,turns){const p=person(pid),active=pid===state.activeId;const row=document.createElement('div');row.dataset.pid=pid;row.className='playerrow'+(active?' active':'');row.style.setProperty('--pcolor',p.color);
 const main=document.createElement('button');main.type='button';main.className='personbutton';main.disabled=reordering||state.finished;main.setAttribute('aria-label',p.name+', '+t[pid]+' Punkte, '+turns[pid]+' '+(turns[pid]===1?'Zug':'Züge')+(active?', am Zug':'')+', antippen zum Auswählen');
 const num=document.createElement('span');num.className='orderindex';num.textContent=(i+1)+'.';const dot=document.createElement('i');dot.className='dot';dot.setAttribute('aria-hidden','true');const label=document.createElement('span');label.className='personlabel';const name=document.createElement('span');name.className='personname';name.textContent=p.name;const count=document.createElement('span');count.className='playerturns';count.textContent=turns[pid]+' '+(turns[pid]===1?'Zug':'Züge');label.append(name,count);const mark=document.createElement('span');mark.className='active-mark';mark.textContent='●';mark.setAttribute('aria-label','am Zug');const score=document.createElement('span');score.className='points';score.textContent=t[pid].toLocaleString('de-DE');main.append(num,dot,label,mark,score);main.addEventListener('click',()=>select(pid));row.append(main);if(reordering)row.append(grip(pid));return row}
function render(){const {totals:t,turns}=stats(),p=person(state.activeId)||person(state.order[0]);if(!p)return;el('activeName').textContent=p.name;el('activeName').style.color=p.color;el('activeScore').textContent=t[p.id].toLocaleString('de-DE');el('orderButton').textContent=reordering?'✓ Fertig':'↕ Reihenfolge';el('orderButton').setAttribute('aria-pressed',String(reordering));el('hint').textContent=reordering?'Am Griff ⠿ ziehen, um die Reihenfolge zu ändern.':'';el('players').replaceChildren(...state.order.map((pid,i)=>makeRow(pid,i,t,turns)));el('undo').disabled=state.finished||!state.history.length;el('orderButton').disabled=state.finished;el('scoreInput').disabled=state.finished;el('finishGame').textContent=state.finished?'Rangliste':'Spiel beenden';updateButton()}
function ranking(){const {totals,turns}=stats();const sorted=[...state.people].sort((a,b)=>totals[b.id]-totals[a.id]||state.order.indexOf(a.id)-state.order.indexOf(b.id));return sorted.map((p)=>({...p,total:totals[p.id],turns:turns[p.id],rank:sorted.findIndex(other=>totals[other.id]===totals[p.id])+1}))}
function renderResults(){const list=el('resultList');list.replaceChildren();const ranked=ranking();const winners=ranked.filter(p=>p.rank===1);const box=el('champion');box.replaceChildren();const title=document.createElement('div');title.textContent=winners.length===1?'★ 1. Platz: '+winners[0].name:'★ Geteilter 1. Platz: '+winners.map(p=>p.name).join(' & ');const hint=document.createElement('small');hint.textContent='Abschlussrangliste nach Gesamtpunkten';box.append(title,hint);
 for(const p of ranked){const row=document.createElement('li');row.className='resultrow'+(p.rank===1?' winner':'');row.style.setProperty('--pcolor',p.color);const rank=document.createElement('span');rank.className='resultrank';rank.textContent=p.rank+'.';const dot=document.createElement('i');dot.className='resultdot';dot.setAttribute('aria-hidden','true');const label=document.createElement('span');label.className='resultname';const name=document.createElement('b');name.textContent=p.name;const turns=document.createElement('small');turns.textContent=p.turns+' '+(p.turns===1?'Zug':'Züge');label.append(name,turns);const score=document.createElement('span');score.className='resultpoints';score.textContent=p.total.toLocaleString('de-DE');const unit=document.createElement('small');unit.textContent='PUNKTE';score.append(unit);row.append(rank,dot,label,score);list.append(row)}}
function openResults(){renderResults();el('resultsOverlay').hidden=false;el('resumeGame').focus()}
function resumeGame(){state.finished=false;persist();el('resultsOverlay').hidden=true;render();el('scoreInput').focus()}
function showSetup(allowCancel){draft=blankPlayers();reordering=false;el('resultsOverlay').hidden=true;el('historyOverlay').hidden=true;el('gameScreen').hidden=true;el('setupScreen').hidden=false;el('cancelSetup').hidden=!allowCancel;renderSetup()}
function renderSetup(){const list=el('setupPlayers');list.replaceChildren();draft.forEach((p,i)=>{const row=document.createElement('div');row.className='setuprow';row.dataset.pid=p.id;row.style.setProperty('--pcolor',p.color);const dot=document.createElement('span');dot.className='setupdot';const input=document.createElement('input');input.className='setupname';input.type='text';input.maxLength=24;input.value=p.name;input.placeholder='Name';input.autocomplete='off';input.setAttribute('aria-label','Name von Spieler '+(i+1));input.addEventListener('input',()=>{p.name=input.value;updateSetupStart()});const remove=document.createElement('button');remove.className='removeplayer';remove.type='button';remove.textContent='×';remove.disabled=draft.length<=2;remove.setAttribute('aria-label',p.name+' entfernen');remove.addEventListener('click',()=>{draft=draft.filter(x=>x.id!==p.id);renderSetup()});row.append(grip(p.id,true),dot,input,remove);list.append(row)});el('addPlayer').disabled=draft.length>=12;updateSetupStart()}
function updateSetupStart(){el('startGame').disabled=draft.length<2||draft.some(p=>!p.name.trim());el('setupCount').textContent=draft.length+' '+(draft.length===1?'Spieler':'Spieler')}
function startNewGame(){if(state.history.length&&!confirm('Neues Spiel vorbereiten? Der aktuelle Spielstand wird erst beim Start des neuen Spiels gelöscht.'))return;showSetup(state.setupDone)}
function leaveSetup(){el('setupScreen').hidden=true;el('gameScreen').hidden=false;render();if(state.finished)openResults()}
function launchGame(){if(draft.length<2||draft.some(p=>!p.name.trim()))return;state.people=draft.map((p,i)=>({...p,name:p.name.trim(),color:p.color||colors[i%colors.length]}));state.order=draft.map(p=>p.id);state.activeId=state.order[0];state.history=[];state.finished=false;state.setupDone=true;reordering=false;persist();el('setupScreen').hidden=true;el('gameScreen').hidden=false;resetEntry();render();alertToast('Spiel gestartet')}
async function shareScores(final=false){const txt='QWIRKLE – '+(final?'Endstand':'Spielstand')+'\n'+ranking().map(p=>p.rank+'. '+p.name+': '+p.total+' Punkte ('+p.turns+' '+(p.turns===1?'Zug':'Züge')+')').join('\n');try{if(navigator.share){await navigator.share({text:txt});return}if(navigator.clipboard){await navigator.clipboard.writeText(txt);alertToast('Spielstand kopiert');return}}catch(e){if(e.name==='AbortError')return}prompt('Spielstand kopieren:',txt)}
function renderHistory(){const hist=el('history');hist.replaceChildren();const items=[...state.history].reverse();if(!items.length){const li=document.createElement('li');li.className='empty';li.textContent='Noch keine Punkte eingetragen.';hist.append(li)}for(const m of items){const li=document.createElement('li');const name=document.createElement('span');name.className='historyname';name.textContent=person(m.pid)?.name||'Spieler';const pts=document.createElement('span');pts.className='historypoints';pts.textContent='+'+m.total;const del=document.createElement('button');del.type='button';del.className='delmove';del.textContent='×';del.setAttribute('aria-label','Zug von '+name.textContent+' löschen');del.addEventListener('click',()=>{state.history=state.history.filter(x=>x.id!==m.id);persist();render();renderHistory();alertToast('Zug entfernt')});li.append(name,pts,del);hist.append(li)}el('share').disabled=!items.length}
function closeHistory(){el('historyOverlay').hidden=true;el('showHistory').focus()}
el('scoreInput').addEventListener('input',updateButton);
el('scoreForm').addEventListener('submit',e=>{e.preventDefault();if(state.finished)return;const val=el('scoreInput').value;if(val===''||!/^[0-9]{1,4}$/.test(val))return;const pts=Number(val),pid=state.activeId;state.history.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),pid,total:pts});state.activeId=state.order[(state.order.indexOf(pid)+1)%state.order.length];persist();resetEntry();render();el('scoreInput').focus({preventScroll:true});alertToast(person(pid).name+': +'+pts+' Punkte')});
el('undo').addEventListener('click',()=>{const last=state.history.pop();if(!last)return;state.activeId=last.pid;persist();render();resetEntry();alertToast('Zug rückgängig')});
el('orderButton').addEventListener('click',()=>{reordering=!reordering;render()});
el('newGame').addEventListener('click',startNewGame);el('newFromResults').addEventListener('click',startNewGame);el('resumeGame').addEventListener('click',resumeGame);el('finishGame').addEventListener('click',()=>{if(!state.finished){state.finished=true;reordering=false;persist();render()}openResults()});
el('showHistory').addEventListener('click',()=>{renderHistory();el('historyOverlay').hidden=false;el('closeHistory').focus()});
el('closeHistory').addEventListener('click',closeHistory);el('closeHistoryBottom').addEventListener('click',closeHistory);el('historyOverlay').addEventListener('click',e=>{if(e.target===el('historyOverlay'))closeHistory()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el('historyOverlay').hidden)closeHistory()});
el('share').addEventListener('click',()=>shareScores(false));el('shareResult').addEventListener('click',()=>shareScores(true));
el('cancelSetup').addEventListener('click',leaveSetup);el('addPlayer').addEventListener('click',()=>{if(draft.length>=12)return;const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);draft.push({id,name:'',color:colors[(draft.length)%colors.length]});renderSetup();const inputs=el('setupPlayers').querySelectorAll('.setupname');inputs[inputs.length-1]?.focus()});el('startGame').addEventListener('click',launchGame);
render();if(state.setupDone){el('gameScreen').hidden=false;if(state.finished)openResults()}else showSetup(false);
})();
</script>
</body>
