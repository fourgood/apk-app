<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>SCHARADE — Familienspiel</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--fg:#f8f9ef;--muted:#9ba3ac;--line:#343c45;--lime:#d7ff65;--panel:#1c222b;--red:#ff877a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.3 system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.35;cursor:default}
#app{max-width:500px;margin:auto;min-height:100dvh;padding:18px 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:15px;font-weight:950;letter-spacing:.14em;display:flex;align-items:center;gap:8px}.brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--lime)}.pill{font-size:12px;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:7px 11px;white-space:nowrap}.body{flex:1;display:flex;flex-direction:column;min-height:0}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--lime);text-transform:uppercase;margin:0 0 9px}.heading{font-size:clamp(32px,8vw,46px);font-weight:950;letter-spacing:-.065em;line-height:.99;margin:6px 0 14px}.desc{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 24px}.grow{flex:1}.btn{border:0;border-radius:17px;padding:16px 18px;font-weight:850;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;gap:10px;transition:transform .12s}.btn:active{transform:scale(.98)}.primary{background:var(--lime);color:#141815}.secondary{background:#2a3039;color:var(--fg)}.ghost{background:none;color:var(--muted);border:1px solid var(--line)}.danger{color:var(--red)}.full{width:100%}.hint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0}.controls{display:flex;gap:9px}.controls .btn{flex:1;min-width:0}.setup-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px;overflow-y:auto;max-height:42dvh}.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:9px 10px;background:var(--panel);min-height:46px}.number{font-size:11px;color:#192017;background:var(--lime);display:grid;place-items:center;border-radius:50%;width:25px;height:25px;font-weight:900}.person-name{font-weight:750;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon-btn{border:0;background:#343c46;color:white;border-radius:9px;min-width:30px;height:29px;font-weight:900}.icon-btn:disabled{opacity:.2}.add-row{display:flex;gap:8px}.add-row input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--fg);outline:0}.add-row input:focus{border-color:var(--lime)}.add-row .btn{min-width:57px;padding:0;font-size:27px}.game-meta{display:flex;justify-content:space-between;gap:9px;font-size:13px;color:var(--muted);margin:4px 0 12px}.progress{display:flex;gap:5px;height:6px}.progress span{flex:1;background:#343c45;border-radius:8px}.progress span.done{background:var(--lime)}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px 15px;margin:14px 0;min-height:230px;overflow:hidden}.stage.actor{touch-action:none;cursor:grab;user-select:none}.stage.actor:active{cursor:grabbing}.stage.time-over{border-color:var(--red)}.stage.time-over .stage-label:first-child{color:var(--red)}.stage::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;filter:blur(65px);background:#d7ff6518;pointer-events:none}.stage-label{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);z-index:1}.big{font-weight:950;letter-spacing:-.065em;font-size:clamp(46px,13vw,80px);line-height:1.04;overflow-wrap:anywhere;margin:15px 0;z-index:1}.word{font-size:clamp(37px,9vw,59px)}.up{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--lime);font-size:12px;font-weight:850;letter-spacing:.05em;margin-top:16px;z-index:1}.up b{font-size:29px;line-height:1}.timer-wrap{display:flex;align-items:center;gap:15px;margin:10px 0 16px}.clock{font-size:37px;letter-spacing:-.07em;font-weight:950;font-variant-numeric:tabular-nums;min-width:76px}.clock.low{color:var(--red)}.timer-track{height:10px;flex:1;background:var(--line);border-radius:99px;overflow:hidden}.timer-track b{height:100%;display:block;background:var(--lime);width:100%;border-radius:99px;transition:width .15s linear}.timer-track b.low{background:var(--red)}.guess-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 11px}.guess-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.guess-grid button{min-height:51px;background:var(--lime);color:#171a13;font-weight:850;border:0;border-radius:13px;padding:10px 6px;overflow-wrap:anywhere;font-size:15px}.guess-grid button:active{transform:scale(.98)}.guess-grid button:last-child:nth-child(odd){grid-column:1/-1}.skip{margin-top:10px}.score-mini{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-mini b{color:var(--fg)}.rank{display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:13px;margin-bottom:8px}.medal{font-size:20px;font-weight:950;min-width:34px;color:var(--muted)}.rank:first-child{border-color:var(--lime)}.rank:first-child .medal{color:var(--lime)}.rank-name{flex:1;font-weight:800}.rank-score{font-size:20px;font-weight:950}.footnote{font-size:12px;color:var(--muted);margin:5px 0 12px}.spacer{flex:1;min-height:8px}.small-btn{background:none;border:0;color:var(--muted);font-size:12px;padding:7px 8px;font-weight:650}.alert{font-size:12px;color:var(--red);min-height:18px;margin-top:7px}.final-title{font-size:clamp(34px,8vw,49px)}
.new-game{border:1px solid var(--line);color:var(--fg);background:#252b34;border-radius:11px;min-height:38px;padding:7px 11px;font-size:13px;font-weight:800;white-space:nowrap}.new-game:active{transform:scale(.97)}.new-game:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.rounds-setting{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:5px 0 10px;padding:11px 12px;border:1px solid var(--line);background:var(--panel);border-radius:14px}.rounds-title{display:flex;flex-direction:column;gap:4px;font-size:14px}.rounds-title small{font-size:11px;color:var(--muted)}.rounds-control{display:flex;align-items:center;gap:7px}.rounds-control .icon-btn{width:33px;height:35px;min-width:33px}.rounds-control input{width:55px;height:38px;border-radius:9px;border:1px solid var(--line);text-align:center;background:var(--bg);color:var(--fg);font-weight:850;font-size:18px;appearance:textfield;-moz-appearance:textfield}.rounds-control input::-webkit-outer-spin-button,.rounds-control input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media(max-height:700px){#app{gap:8px;padding-top:10px}.stage{min-height:165px;margin:7px 0;padding:15px 12px}.big{margin:9px 0;font-size:clamp(41px,11vw,64px)}.desc{margin-bottom:12px}.timer-wrap{margin:4px 0 9px}.btn{min-height:48px;padding:12px}.setup-list{max-height:36dvh}.heading{margin:0 0 11px}}
</style>
</head>
<body><main id="app" aria-live="polite"></main>
<script>
(()=>{
'use strict';
const WORDS=["Fußball","Handball","Kopfball","Torwart","Torwand","Sportplatz","Sportschuh","Turnschuh","Tanzschuh","Tanzkurs","Kopfstand","Handstand","Kopfsprung","Hochsprung","Weitsprung","Rennrad","Fahrrad","Rollschuh","Rollbrett","Springseil","Hüpfburg","Schwimmring","Schwimmbrille","Schwimmflosse","Eislauf","Eisbahn","Schlittschuh","Schneeschuh","Schneeball","Schneemann","Skibrille","Skischuh","Skilift","Skistock","Schlittenfahrt","Basketball","Tennisball","Federball","Volleyball","Wasserball","Tischtennis","Turnhalle","Turnmatte","Tanzpaar","Eisbär","Braunbär","Tanzbär","Waschbär","Plüschbär","Goldfisch","Clownfisch","Seehund","Seestern","Seepferdchen","Haustier","Hausmaus","Hauskatze","Feldmaus","Fledermaus","Hasenohr","Hasenfuß","Kuhstall","Kuhglocke","Milchkuh","Milchzahn","Schafstall","Schafmilch","Sparschwein","Wildschwein","Glücksschwein","Hühnerstall","Hühnerei","Fuchsbau","Fuchsschwanz","Rotfuchs","Laubfrosch","Teichfrosch","Hundeleine","Hundepfote","Katzenklo","Katzenbaum","Katzenpfote","Pferdestall","Pferdekopf","Pferdeschwanz","Pferdehuf","Pferdekutsche","Vogelhaus","Vogelnest","Vogelkäfig","Bienenstock","Tintenfisch","Tierarzt","Baumhaus","Baumstamm","Waldweg","Waldsee","Sandburg","Sandkasten","Sandmann","Sanduhr","Strandkorb","Eisberg","Eisbad","Eistee","Eiswaffel","Eisbecher","Eiswürfel","Eisdiele","Windrad","Windmühle","Blitzschlag","Regenwurm","Regenbogen","Regenjacke","Regenschirm","Regentropfen","Regenpfütze","Mondlicht","Mondschein","Vollmond","Halbmond","Sternbild","Sternschnuppe","Sonnenhut","Sonnenbrille","Sonnenblume","Sonnencreme","Wasserfall","Wasserhahn","Wasserflasche","Wasserpistole","Wasserbombe","Wassermelone","Meerwasser","Bergsee","Bergschuh","Bergbahn","Bergsteiger","Flusskrebs","Blumenstrauß","Brotkorb","Brotmesser","Brotdose","Toastbrot","Käsebrot","Wurstbrot","Butterbrot","Käsekuchen","Apfelmus","Apfelbaum","Apfelkuchen","Apfelsaft","Erdbeereis","Kirschkuchen","Kirschbaum","Kirschsaft","Bananenschale","Zitronensaft","Kuchenteig","Kuchenform","Kuchenstück","Schokokeks","Schokoriegel","Honigglas","Milchglas","Milchreis","Milchbart","Kaffeetasse","Kaffeekanne","Teetasse","Teekanne","Teebeutel","Suppentopf","Suppenkelle","Kartoffelbrei","Salatkopf","Obstsalat","Spiegelei","Rührei","Eierbecher","Eieruhr","Nudelsuppe","Nudelholz","Zuckerwatte","Zuckerwürfel","Maiskolben","Handschuh","Handtuch","Handschlag","Handkuss","Handpuppe","Handtasche","Kopftuch","Kopfweh","Kopfnuss","Kopfkissen","Kopfhörer","Kopflaus","Fußbad","Fußtritt","Fußmatte","Bauchweh","Bauchlandung","Bauchtanz","Zahnweh","Zahnarzt","Zahnfee","Zahnpasta","Zahnbürste","Zahnseide","Zahnspange","Ohrring","Ohrwurm","Ohrmuschel","Nasenloch","Nasenring","Nasenspray","Armbruch","Armband","Beinbruch","Halsband","Halstuch","Halskette","Fingerhut","Fingernagel","Kniestrumpf","Kniebeuge","Schlafsack","Schlafanzug","Schlafmütze","Nachthemd","Nachtlicht","Nachttisch","Hausschuh","Holzschuh","Schuhschrank","Strohhut","Hexenhut","Hausboot","Puppenhaus","Hochhaus","Hausdach","Haustür","Hauswand","Dachfenster","Dachboden","Türgriff","Türschloss","Türklingel","Fensterbank","Fensterscheibe","Tischbein","Tischdecke","Tischplatte","Tischlampe","Stuhlbein","Drehstuhl","Klappstuhl","Bettdecke","Bettlaken","Sofakissen","Wanduhr","Wandschrank","Wandspiegel","Kühlschrank","Küchentisch","Kochtopf","Kochlöffel","Kochbuch","Backofen","Backblech","Topflappen","Spülbecken","Spülbürste","Waschmaschine","Waschbecken","Waschlappen","Wäschekorb","Wäscheklammer","Wäscheleine","Staubsauger","Staubwedel","Besenstiel","Kehrblech","Haarbürste","Haarspange","Haarschnitt","Seifenblase","Seifenschaum","Badewanne","Klodeckel","Klobürste","Klopapier","Fernseher","Fernbedienung","Lichtschalter","Taschenlampe","Telefonhörer","Schlüsselbund","Schlüsselloch","Laufrad","Dreirad","Lastenrad","Radweg","Fahrstuhl","Fahrkarte","Fahrplan","Fahrgast","Schulbus","Stadtbus","Reisebus","Busfahrt","Busfahrer","Bushaltestelle","Zugfahrt","Nachtzug","Schnellzug","Autotür","Autoreifen","Autositz","Autoschlüssel","Autofahrer","Autowäsche","Parkbank","Parkplatz","Parkhaus","Parkuhr","Parkschein","Zebrastreifen","Straßenbahn","Straßenschild","Schiffbruch","Segelschiff","Ruderboot","Segelboot","Tretboot","Schlauchboot","Bootsfahrt","Flugzeug","Flugplatz","Flughafen","Fallschirm","Hubschrauber","Mondflug","Schulweg","Schulhof","Schulbank","Schulbuch","Schulheft","Schultafel","Schulkind","Schulranzen","Schultasche","Buchladen","Bücherregal","Lesebrille","Leselampe","Lesezeichen","Schreibheft","Schreibblock","Bleistift","Buntstift","Filzstift","Malbuch","Malkasten","Radiergummi","Spielplatz","Spielzeug","Spielball","Spielbrett","Spielfigur","Puppenbett","Puppenwagen","Baustelle","Kletterwand","Klettergerüst","Rutschbahn","Rutschauto","Schaukelstuhl","Schaukelpferd","Seilbahn","Seiltanz","Papierflieger","Feuerwehr","Feueralarm","Feuerlöscher","Lagerfeuer","Feuerwerk","Polizeiauto","Polizeihund","Postbote","Postkarte","Bauarbeiter","Baukran","Müllmann","Müllwagen","Mülltonne","Kochmütze","Kinderarzt","Krankenwagen","Königsthron","Ritterburg","Piratenschiff","Schatztruhe","Schatzkarte","Schatzsuche","Zauberstab","Zaubertrick","Hexenbesen","Hexenhaus","Hexenkessel","Geisterbahn","Drachenkopf","Weihnachtsbaum","Weihnachtsmann","Osterhase","Osterei","Luftballon","Zeltplatz","Zeltlager","Glockenturm","Ameisenhaufen","Elefantenrüssel","Löwenmähne","Tigerfell","Pferdewagen","Schäferhund","Vogelspinne","Stachelschwein","Wespennest","Fliegenklatsche","Marmeladenbrot","Frühstücksei","Vanilleeis","Himbeereis","Zitroneneis","Honigkuchen","Tomatensuppe","Kürbissuppe","Schokoladentafel","Kuchengabel","Salatschüssel","Wasserglas","Blumenwiese","Blumenbeet","Blumenvase","Blumenkohl","Waldbrand","Baumrinde","Tannenzapfen","Tannenbaum","Nadelbaum","Heuhaufen","Berggipfel","Wolkenkratzer","Wolkenbruch","Sonnenaufgang","Sonnenuntergang","Wintermantel","Schneeflocke","Schneepflug","Schneesturm","Augenklappe","Augenarzt","Armlehne","Fingerabdruck","Handschelle","Faustschlag","Ohrenschützer","Gartentor","Gartenzaun","Gartenschlauch","Gartenzwerg","Blumenkasten","Blumenladen","Badetuch","Badehose","Bademantel","Schwimmbad","Schwimmflügel","Regenmantel","Gummistiefel","Schirmständer","Bilderrahmen","Uhrzeiger","Autounfall","Autokino","Feuerleiter","Feuerwehrmann","Polizeiwache","Tierpark","Marktplatz","Kuhfladen","Keksdose","Nasenbluten","Mausefalle","Geburtstagskuchen","Geburtstagskind","Zirkuszelt"];
const WORD_BANK_VERSION=3;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=sel=>document.querySelector(sel);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clampRounds=n=>{const x=Math.round(Number(n));return Number.isFinite(x)?Math.min(100,Math.max(1,x)):10};
const state={roundsGoal:10,phase:'setup',players:[],actor:0,turn:0,deck:[],word:'',end:0,remaining:60,audio:null,ticker:null,lastTick:null,timeUp:false,lastWord:'',notification:'',input:''};
const save=()=>{try{localStorage.setItem('scharade-v1',JSON.stringify({players:state.players,roundsGoal:state.roundsGoal,phase:state.phase,actor:state.actor,turn:state.turn,deck:state.deck,word:state.word,end:state.end,remaining:state.remaining,timeUp:state.timeUp,lastWord:state.lastWord,vocab:WORD_BANK_VERSION}))}catch(e){}};
const read=()=>{try{const d=JSON.parse(localStorage.getItem('scharade-v1'));if(d&&Array.isArray(d.players)&&d.players.length&&d.players.every(p=>p&&typeof p.name==='string'&&typeof p.score==='number')){Object.assign(state,{players:d.players,roundsGoal:clampRounds(d.roundsGoal??10),phase:['setup','actor','word','results'].includes(d.phase)?d.phase:'setup',actor:Number(d.actor)||0,turn:Number(d.turn)||0,deck:Array.isArray(d.deck)?d.deck:[],word:d.word||'',end:Number(d.end)||0,remaining:Math.max(0,Number(d.remaining??60)),timeUp:Boolean(d.timeUp),lastWord:d.lastWord||''});if(d.vocab!==WORD_BANK_VERSION){state.deck=[];if(state.phase==='word'&&!WORDS.includes(state.word)){state.phase='actor';state.word='';state.end=0;state.remaining=60;state.timeUp=false}}}}catch(e){} };
const header=()=>`<header class="top"><div class="brand"><i></i>SCHARADE</div>${state.phase==='setup'?'<div class="pill">FAMILIEN-EDITION</div>':'<button type="button" class="new-game" id="restart">↻ Neues Spiel</button>'}</header>`;
function render(){clearInterval(state.ticker);state.ticker=null;const app=$('#app');if(state.phase==='setup'){
 app.innerHTML=`${header()}<section class="body"><p class="eyebrow" style="margin-top:23px">SPIELVORBEREITUNG</p><h1 class="heading">Wer spielt<br>mit?</h1><p class="desc">Tragt euch <b>im Uhrzeigersinn</b> ein. Der erste Spieler wird ausgelost.</p><div class="setup-list" id="players">${state.players.map((p,i)=>`<div class="person"><span class="number">${i+1}</span><span class="person-name">${esc(p.name)}</span><button class="icon-btn" data-move="up" data-i="${i}" aria-label="${esc(p.name)} nach oben" ${i===0?'disabled':''}>↑</button><button class="icon-btn" data-move="down" data-i="${i}" aria-label="${esc(p.name)} nach unten" ${i===state.players.length-1?'disabled':''}>↓</button><button class="icon-btn" data-remove="${i}" aria-label="${esc(p.name)} entfernen">×</button></div>`).join('')}</div><form class="add-row" id="add"><input id="new-name" maxlength="20" autocomplete="off" placeholder="Name eingeben" aria-label="Neuer Spieler" value="${esc(state.input)}"><button type="submit" class="btn primary" aria-label="Spieler hinzufügen">+</button></form><div id="msg" class="alert"></div><div class="rounds-setting"><div class="rounds-title"><strong>Wie viele Runden?</strong><small>1 Runde = 1 Begriff</small></div><div class="rounds-control"><button type="button" class="icon-btn" id="round-minus" aria-label="Eine Runde weniger">−</button><input type="number" id="round-count" aria-label="Anzahl Runden" value="${state.roundsGoal}" min="1" max="100" inputmode="numeric"><button type="button" class="icon-btn" id="round-plus" aria-label="Eine Runde mehr">+</button></div></div><div class="spacer"></div><button id="start" class="btn primary full" ${state.players.length<2?'disabled':''}>Spiel starten →</button><p class="hint">${state.roundsGoal} ${state.roundsGoal===1?'Begriff':'Begriffe'} · 60 Sek. pro Begriff · 1 Punkt pro Treffer</p></section>`;
 $('#add').addEventListener('submit',e=>{e.preventDefault();const el=$('#new-name'),name=el.value.trim().replace(/\s+/g,' ');if(!name){el.focus();return}if(state.players.some(p=>p.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))){$('#msg').textContent='Diesen Namen gibt es schon.';return}if(state.players.length>=16){$('#msg').textContent='Maximal 16 Spieler.';return}state.players.push({name,score:0});state.input='';save();render();$('#new-name').focus()});
 $('#new-name').addEventListener('input',e=>state.input=e.target.value);
 app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.players.splice(+b.dataset.remove,1);save();render()});
 app.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=i+(b.dataset.move==='up'?-1:1);[state.players[i],state.players[j]]=[state.players[j],state.players[i]];save();render()});
 $('#round-minus').onclick=()=>{state.roundsGoal=clampRounds(state.roundsGoal-1);save();render()};
 $('#round-plus').onclick=()=>{state.roundsGoal=clampRounds(state.roundsGoal+1);save();render()};
 $('#round-count').addEventListener('input',e=>{if(e.target.value!==''){state.roundsGoal=clampRounds(e.target.value);save();const h=$('.hint');if(h)h.textContent=`${state.roundsGoal} ${state.roundsGoal===1?'Begriff':'Begriffe'} · 60 Sek. pro Begriff · 1 Punkt pro Treffer`}});
 $('#round-count').addEventListener('change',e=>{state.roundsGoal=clampRounds(e.target.value||10);e.target.value=state.roundsGoal;save()});
 $('#start').onclick=()=>{state.roundsGoal=clampRounds($('#round-count').value);start()};
}else if(state.phase==='actor'){
 const name=esc(state.players[state.actor].name);
 app.innerHTML=`${header()}<section class="body"><div class="game-meta"><span>BEGRIFF ${state.turn+1} / ${state.roundsGoal}</span><span>IM UHRZEIGERSINN ↻</span></div>${progress()}<div class="stage actor" id="swipe" tabindex="0" role="button" aria-label="Nach oben wischen oder tippen, um Begriff zu zeigen"><span class="stage-label">DU BIST DRAN</span><div class="big">${name}</div><div class="up"><b>↑</b>NACH OBEN WISCHEN</div></div><button class="btn primary full" id="reveal">Begriff anzeigen ↑</button><div class="score-mini" style="text-align:center;margin:12px 0">${miniScores()}</div></section>`;
 $('#reveal').onclick=reveal;
 const box=$('#swipe');let firstY=null;box.addEventListener('pointerdown',e=>{firstY=e.clientY});box.addEventListener('pointerup',e=>{if(firstY!==null&&firstY-e.clientY>38)reveal();firstY=null});box.addEventListener('click',e=>{if(e.detail===0)reveal()});box.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='Enter'){e.preventDefault();reveal()}});
}else if(state.phase==='word'){
 app.innerHTML=`${header()}<section class="body"><div class="game-meta"><span>BEGRIFF ${state.turn+1} / ${state.roundsGoal}</span><span>${esc(state.players[state.actor].name)} SPIELT</span></div>${progress()}<div class="timer-wrap"><span class="clock" id="clock">1:00</span><div class="timer-track"><b id="fill"></b></div></div><div class="stage ${state.timeUp?'time-over':''}"><span class="stage-label">${state.timeUp?'ZEIT VORBEI – JETZT AUSWERTEN':'STELL DAS DAR!'}</span><div class="big word">${esc(state.word)}</div><span class="stage-label">${state.timeUp?'AUCH JETZT NOCH PUNKTE VERGEBEN':'OHNE WORTE · NUR PANTOMIME'}</span></div><p class="guess-label">WER HAT ES ERRATEN?</p><div class="guess-grid">${state.players.map((p,i)=>i!==state.actor?`<button data-winner="${i}">${esc(p.name)}</button>`:'').join('')}</div><button class="btn ghost full skip" id="skip">Nicht erraten — weiter →</button></section>`;
 app.querySelectorAll('[data-winner]').forEach(b=>b.onclick=()=>complete(+b.dataset.winner));$('#skip').onclick=()=>complete(null);updateTimer();if(state.remaining>0)state.ticker=setInterval(updateTimer,120);
}else if(state.phase==='results'){
 const sorted=state.players.map((p,i)=>({...p,index:i})).sort((a,b)=>b.score-a.score||a.index-b.index);let rank=0,prev=-1;
 app.innerHTML=`${header()}<section class="body"><p class="eyebrow" style="margin-top:30px">RUNDE BEENDET</p><h1 class="heading final-title">Das war's.<br>Gut gespielt!</h1><p class="desc">${state.roundsGoal} ${state.roundsGoal===1?'Begriff':'Begriffe'} gespielt. Hier kommt die Rangliste:</p><div>${sorted.map((p,i)=>{if(p.score!==prev)rank=i+1;prev=p.score;return `<div class="rank"><span class="medal">${rank}.</span><span class="rank-name">${esc(p.name)}</span><span class="rank-score">${p.score} <small style="font-size:11px;color:var(--muted);font-weight:650">Pkt.</small></span></div>`}).join('')}</div><div class="spacer"></div><button class="btn primary full" id="again">Nochmal spielen ↻</button><button class="btn ghost full" style="margin-top:9px" id="edit">Spieler ändern</button><p class="hint">Nächste Runde: neuer zufälliger Startspieler</p></section>`;
 $('#again').onclick=start;$('#edit').onclick=()=>{state.phase='setup';state.players.forEach(p=>p.score=0);save();render()};
}}
function progress(){return state.roundsGoal<=25?`<div class="progress" aria-label="${state.turn} von ${state.roundsGoal} Begriffen gespielt">${Array.from({length:state.roundsGoal},(_,i)=>`<span class="${i<state.turn?'done':''}"></span>`).join('')}</div>`:`<div class="progress" aria-label="${state.turn} von ${state.roundsGoal} Begriffen gespielt"><span style="background:linear-gradient(to right,var(--lime) ${state.turn/state.roundsGoal*100}%,#343c45 ${state.turn/state.roundsGoal*100}%)"></span></div>`}
function miniScores(){return state.players.map(p=>`${esc(p.name)} <b>${p.score}</b>`).join(' &nbsp;·&nbsp; ')}
function newDeck(){const d=shuffle(WORDS);if(d.length>1&&d[0]===state.lastWord){[d[0],d[1]]=[d[1],d[0]]}return d}
function restartToSetup(){
 clearInterval(state.ticker);state.ticker=null;
 state.phase='setup';state.actor=0;state.turn=0;state.word='';state.end=0;
 state.remaining=60;state.lastTick=null;state.timeUp=false;state.input='';
 state.players.forEach(p=>p.score=0);
 // Die Reihenfolge, Namen, Rundenzahl und ungenutzten Begriffe bleiben erhalten.
 save();render();
}
$('#app').addEventListener('click',e=>{
 if(!e.target.closest('#restart'))return;
 if(state.phase==='setup')return;
 if(state.phase==='results'||window.confirm('Laufendes Spiel abbrechen und zur Spielerauswahl zurückkehren? Die bisherigen Punkte gehen verloren.'))restartToSetup();
});
function start(){if(state.players.length<2)return;state.players.forEach(p=>p.score=0);if(!state.deck.length)state.deck=newDeck();state.actor=Math.floor(Math.random()*state.players.length);state.turn=0;state.phase='actor';state.timeUp=false;state.word='';state.end=0;save();render()}
function beep(freq=850,duration=.12,style='sine',volume=.15){try{if(!state.audio){state.audio=new (window.AudioContext||window.webkitAudioContext)()}const a=state.audio;if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.type=style;o.frequency.setValueAtTime(freq,a.currentTime);g.gain.setValueAtTime(volume,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);o.connect(g);g.connect(a.destination);o.start(a.currentTime);o.stop(a.currentTime+duration+.02)}catch(e){}}
function reveal(){if(state.phase!=='actor')return;if(!state.deck.length)state.deck=newDeck();state.word=state.deck.shift();state.lastWord=state.word;state.phase='word';state.end=Date.now()+60000;state.remaining=60;state.lastTick=60;state.timeUp=false;beep(740,.12);save();render()}
function updateTimer(){if(state.phase!=='word')return;const left=Math.max(0,Math.ceil((state.end-Date.now())/1000));state.remaining=left;const display=$('#clock'),fill=$('#fill');if(!display||!fill)return;display.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;display.classList.toggle('low',left<=10);fill.style.width=`${left/60*100}%`;fill.classList.toggle('low',left<=10);if(left!==state.lastTick){if(left===10)beep(750,.14);if(left<=5&&left>0)beep(900,.10);state.lastTick=left}if(left===0&&!state.timeUp){state.timeUp=true;beep(290,.47,'sawtooth',.16);if(navigator.vibrate)navigator.vibrate([150,70,220]);const stage=$('.stage');if(stage)stage.classList.add('time-over');const labels=document.querySelectorAll('.stage-label');if(labels[0])labels[0].textContent='ZEIT VORBEI – JETZT AUSWERTEN';if(labels[1])labels[1].textContent='AUCH JETZT NOCH PUNKTE VERGEBEN';save()}if(left===0){clearInterval(state.ticker);state.ticker=null}}
function complete(winner){if(state.phase!=='word')return;clearInterval(state.ticker);state.ticker=null;if(winner!==null&&winner!==state.actor&&state.players[winner]){state.players[winner].score++ ;beep(1020,.15);setTimeout(()=>beep(1450,.13),115)}state.turn++;state.actor=(state.actor+1)%state.players.length;state.phase=state.turn>=state.roundsGoal?'results':'actor';state.end=0;state.timeUp=false;save();render()}
read();render();
})();
</script></body></html>
